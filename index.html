<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de Visitas</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { background: #f5f5f5; }
.app { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; text-align: center; padding: 20px; }
.header { background: #00C853; color: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
.header h1 { font-size: 24px; margin-bottom: 10px; }
.contador { font-size: 48px; font-weight: 900; }
.sub { font-size: 14px; opacity: 0.9; }
.box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
.btn { background: #00C853; color: #fff; border: none; padding: 15px 30px; border-radius: 25px; font-weight: 900; font-size: 16px; cursor: pointer; width: 100%; }
.btn:hover { background: #00a843; }
.lista { text-align: left; }
.usuario { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
.online { color: #00C853; font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>👥 Sala de Visitas</h1>
    <div class="contador" id="contador">0</div>
    <div class="sub">Personas conectadas ahora</div>
  </div>

  <div class="box">
    <h3 style="margin-bottom: 15px;">Tu nombre</h3>
    <input id="nombreInput" placeholder="Escribe tu nombre" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; margin-bottom: 15px;">
    <button class="btn" onclick="entrar()">ENTRAR A LA SALA</button>
  </div>

  <div class="box lista">
    <h3 style="margin-bottom: 10px;">Conectados ahora:</h3>
    <div id="listaUsuarios"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, onValue, runTransaction, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

// TU CONFIG DE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyD_OgFQRdkDVNSQPq48zNE6s1J7Y7I__js",
  authDomain: "pagos-yape-4968b.firebaseapp.com",
  databaseURL: "https://pagos-yape-4968b-default-rtdb.firebaseio.com",
  projectId: "pagos-yape-4968b",
  storageBucket: "pagos-yape-4968b.firebasestorage.app",
  messagingSenderId: "104083728326",
  appId: "1:104083728326:web:fc2fd7ee876a60f45434c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let deviceId = localStorage.getItem('device_id') || 'user_' + Date.now();
localStorage.setItem('device_id', deviceId);
let miNombre = "";

const contadorRef = ref(db, 'estadisticas/usuariosOnline');
const onlineRef = ref(db, 'online/' + deviceId);
const usuariosRef = ref(db, 'usuariosConectados');

// 1. MOSTRAR CONTADOR EN VIVO
onValue(contadorRef, (snap) => {
  document.getElementById('contador').innerText = snap.val() || 0;
});

// 2. MOSTRAR LISTA DE USUARIOS
onValue(usuariosRef, (snap) => {
  const usuarios = snap.val() || {};
  let html = "";
  Object.values(usuarios).forEach(u => {
    html += `<div class="usuario"><span>${u.nombre}</span> <span class="online">● Online</span></div>`;
  });
  document.getElementById('listaUsuarios').innerHTML = html || "<div style='color:#999;'>Nadie conectado</div>";
});

function entrar(){
  miNombre = document.getElementById('nombreInput').value.trim();
  if(miNombre == ""){ alert("Pon tu nombre"); return; }

  // SUMAR +1 AL CONTADOR
  runTransaction(contadorRef, (count) => (count || 0) + 1);
  
  // GUARDAR QUE ESTOY ONLINE
  set(onlineRef, true);
  set(ref(db, 'usuariosConectados/' + deviceId), { nombre: miNombre, hora: Date.now() });

  // CUANDO CIERRA LA PAGINA: RESTAR -1
  window.addEventListener('beforeunload', salir);
  
  // SI SE CAE EL INTERNET: RESTAR -1 AUTOMATICO
  onDisconnect(onlineRef).remove();
  onDisconnect(ref(db, 'usuariosConectados/' + deviceId)).remove();
  onDisconnect(contadorRef).transaction((count) => Math.max(0, (count || 1) - 1));

  document.querySelector('.btn').innerText = "YA ESTAS EN LA SALA";
  document.querySelector('.btn').disabled = true;
  document.getElementById('nombreInput').disabled = true;
}

function salir(){
  runTransaction(contadorRef, (count) => Math.max(0, (count || 1) - 1));
  remove(onlineRef);
  remove(ref(db, 'usuariosConectados/' + deviceId));
}
</script>
</body>
</html>
