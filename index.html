<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design</title>
<style>
  body{background:#2F2F2F;color:#fff;font-family:sans-serif;margin:0}
  .top{display:flex;align-items:center;padding:10px 15px;background:#1a1a1a}
  .contador{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="top">
  <div class="contador">
    <svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    <b id="contadorGlobal">0</b>
  </div>
  <button style="margin-left:auto">Registrate</button>
</div>

<h2 style="padding:15px">Tu contenido...</h2>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // IMPORTANTE: PEGA TU CONFIG REAL AQUÍ
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com", // OJO CON ESTE
    projectId: "TU_PROYECTO",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "123456",
    appId: "1:123:web:abc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const userId = 'user_' + Date.now();
  const userRef = ref(db, 'online/' + userId);
  const contadorRef = ref(db, 'estadisticas/usuariosOnline');

  // 1. SUMAR AL ENTRAR
  set(userRef, true);
  runTransaction(contadorRef, (c) => (c || 0) + 1);

  // 2. RESTAR AL SALIR
  window.addEventListener('beforeunload', () => {
    runTransaction(contadorRef, (c) => Math.max(0, (c || 1) - 1));
    set(userRef, null);
  });

  onDisconnect(userRef).remove();
  onDisconnect(contadorRef).transaction((c) => Math.max(0, (c || 1) - 1));

  // 3. MOSTRAR
  onValue(contadorRef, (snap) => {
    document.getElementById('contadorGlobal').innerText = snap.val() || 0;
  });
</script>

</body>
</html>
