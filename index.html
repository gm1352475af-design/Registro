<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>
<style>
  body{background:#2F2F2F;color:#fff;font-family:sans-serif}
  .contador{display:flex;align-items:center;gap:5px;padding:10px}
</style>
</head>
<body>

<div class="contador">
  <svg width="20" height="20" fill="white"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
  <span id="contadorGlobal">0</span>
</div>

<h1>Tu contenido aquí...</h1>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // PEGA AQUÍ TU CONFIG DE FIREBASE
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
    projectId: "TU_PROYECTO",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "123",
    appId: "1:123:web:abc"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  function escucharContador(){
    const userId = 'user_' + Date.now() + '_' + Math.random();
    const userOnlineRef = ref(db, 'online/' + userId);
    const contadorRef = ref(db, 'estadisticas/usuariosOnline');

    // SUMAR AL ENTRAR
    set(userOnlineRef, true);
    runTransaction(contadorRef, (c) => (c||0) + 1);

    // RESTAR AL SALIR
    const salir = () => {
      runTransaction(contadorRef, (c) => Math.max(0, (c||1) - 1));
      set(userOnlineRef, null);
    }
    window.addEventListener('beforeunload', salir);
    onDisconnect(userOnlineRef).remove();
    onDisconnect(contadorRef).transaction((c) => Math.max(0, (c||1) - 1));

    // MOSTRAR
    onValue(contadorRef, (snap) => {
      document.getElementById('contadorGlobal').innerText = snap.val() || 0;
    });
  }

  escucharContador();
</script>
</body>
</html>
