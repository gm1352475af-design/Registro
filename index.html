<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design</title>
<style>
  body{background:#2F2F2F;color:#fff;font-family:sans-serif;margin:0}
  .top{display:flex;align-items:center;padding:12px 15px;background:#1a1a1a}
  .contador{display:flex;align-items:center;gap:6px;font-size:16px}
</style>
</head>
<body>

<div class="top">
  <div class="contador">
    <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    <span id="contadorGlobal">0</span>
  </div>
  <button style="margin-left:auto;background:#ff2d55;border:none;color:#fff;padding:8px 14px;border-radius:6px">Registrate</button>
</div>

<h2 style="padding:15px">Bienvenido</h2>


<script type="module">
  // TU CONFIG DE FIREBASE YA PEGADA
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD_OgFQRdkDVNSQPq48zNE6s1J7Y7I__js",
    authDomain: "pagos-yape-4968b.firebaseapp.com",
    databaseURL: "https://pagos-yape-4968b-default-rtdb.firebaseio.com",
    projectId: "pagos-yape-4968b",
    storageBucket: "pagos-yape-4968b.firebasestorage.app",
    messagingSenderId: "104083728326",
    appId: "1:104083728326:web:fc2fd7ee876a60f45434c7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
  const userRef = ref(db, 'online/' + userId);
  const contRef = ref(db, 'estadisticas/usuariosOnline');

  // 1. AL ENTRAR: SUMA 1
  set(userRef, true);
  runTransaction(contRef, (c) => (c || 0) + 1);

  // 2. AL SALIR: RESTA 1
  window.addEventListener('beforeunload', () => {
    runTransaction(contRef, (c) => Math.max(0, (c || 1) - 1));
    set(userRef, null);
  });
  onDisconnect(userRef).remove();
  onDisconnect(contRef).transaction((c) => Math.max(0, (c || 1) - 1));

  // 3. MOSTRAR EN PANTALLA
  onValue(contRef, (snap) => {
    document.getElementById('contadorGlobal').innerText = snap.val() || 0;
  });
</script>

</body>
</html>
