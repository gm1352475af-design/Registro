<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Design</title>
<style>
  body{background:#2F2F2F;color:#fff;font-family:sans-serif;margin:0}
  .top{display:flex;align-items:center;padding:12px 15px;background:#1a1a1a; justify-content: space-between;}
  .x-btn{background:#ff3b30;border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px}
</style>
</head>
<body>

<div class="top">
  <div style="display:flex;align-items:center;">
    <svg width="20" height="20" fill="white"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    <span id="contadorGlobal" style="margin-left:8px;font-size:18px;font-weight:bold">0</span>
  </div>
  <button class="x-btn" onclick="salirApp()">X Salir</button>
</div>

<!-- TU FIREBASE VIEJO - NO FALLA -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // TU CONFIG
  var firebaseConfig = {
    apiKey: "AIzaSyD_OgFQRdkDVNSQPq48zNE6s1J7Y7I__js",
    authDomain: "pagos-yape-4968b.firebaseapp.com",
    databaseURL: "https://pagos-yape-4968b-default-rtdb.firebaseio.com",
    projectId: "pagos-yape-4968b",
    storageBucket: "pagos-yape-4968b.firebasestorage.app",
    messagingSenderId: "104083728326",
    appId: "1:104083728326:web:fc2fd7ee876a60f45434c7"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  
  // ID único por pestaña
  var sessionId = 'sesion_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
  var sesionRef = db.ref('sesiones/' + sessionId);
  var contRef = db.ref('estadisticas/usuariosOnline');

  // 1. AL ENTRAR AL LINK = +1
  sesionRef.set(true);
  contRef.transaction(function(c){ return (c || 0) + 1; });

  // 2. AL DAR CLICK EN X = -1
  function salirApp(){
    sesionRef.remove();
    contRef.transaction(function(c){ return Math.max(0, (c || 1) - 1); });
    alert("Saliste de la app");
    window.close(); // cierra pestaña si se puede
  }

  // 3. SI CIERRA PESTAÑA SIN DAR X = -1 TAMBIEN
  window.addEventListener('beforeunload', function(){
    sesionRef.remove();
    contRef.transaction(function(c){ return Math.max(0, (c || 1) - 1); });
  });
  
  // Por si se cae internet
  sesionRef.onDisconnect().remove();

  // 4. MOSTRAR CONTADOR
  contRef.on('value', function(snap){
    document.getElementById('contadorGlobal').innerText = snap.val() || 0;
  });
</script>

</body>
</html>
