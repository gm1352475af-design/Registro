<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Design</title>
<style>
  body{background:#2F2F2F;color:#fff;font-family:sans-serif;margin:0}
  .top{display:flex;align-items:center;padding:12px 15px;background:#1a1a1a; justify-content: space-between;}
  .x-btn{background:red;border:none;color:white;padding:5px 10px;border-radius:5px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<div class="top">
  <div style="display:flex;align-items:center;">
    <svg width="20" height="20" fill="white"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    <span id="contadorGlobal" style="margin-left:8px;font-size:18px;font-weight:bold">0</span>
  </div>
  <button class="x-btn" onclick="salirApp()">X Salir</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyD_OgFQRdkDVNSQPq48zNE6s1J7Y7I__js",
    authDomain: "pagos-yape-4968b.firebaseapp.com",
    databaseURL: "https://pagos-yape-4968b-default-rtdb.firebaseio.com",
    projectId: "pagos-yape-4968b",
    storageBucket: "pagos-yape-4968b.firebasestorage.app",
    messagingSenderId: "104083728326",
    appId: "1:104083728326:web:fc2fd7ee876a60f45434c7"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  
  var contRef = db.ref('estadisticas/usuariosOnline');
  var sesionRef = db.ref('sesiones/' + Date.now() + '_' + Math.random());

  var yaConto = false; // Para que no sume 2 veces

  // 1. CUANDO DA CLICK AL LINK Y ENTRA A LA APP
  function entrarApp(){
    if(!yaConto){
      sesionRef.set(true); // Creamos una sesion
      contRef.transaction(function(c){ return (c || 0) + 1; }); // +1
      yaConto = true;
      console.log("Entro +1");
    }
  }

  // 2. CUANDO DA CLICK EN LA X PARA SALIR
  function salirApp(){
    sesionRef.remove(); // Borramos la sesion
    contRef.transaction(function(c){ return Math.max(0, (c || 1) - 1); }); // -1
    yaConto = false;
    alert("Saliste de la app");
    window.close(); // Intenta cerrar la pestaña
  }

  // 3. SI CIERRA LA PESTAÑA SIN DAR X, TAMBIEN RESTA
  window.addEventListener('beforeunload', function(){
    if(yaConto){
      sesionRef.remove();
      contRef.transaction(function(c){ return Math.max(0, (c || 1) - 1); });
    }
  });

  // 4. MOSTRAR EL CONTADOR
  contRef.on('value', function(snap){
    document.getElementById('contadorGlobal').innerText = snap.val() || 0;
  });

  // EJECUTAR AL CARGAR LA PAGINA = "DIO CLICK AL LINK"
  entrarApp();

</script>

</body>
</html>
