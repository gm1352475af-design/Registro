<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELUCK Login</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  body{background:#000; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
  .box{background:#111; border:2px solid #00ff88; padding:30px; border-radius:15px; width:350px}
  h1{color:#00ff88; text-align:center; margin-bottom:20px}
  input{width:100%; padding:12px; margin:10px 0; background:#222; border:1px solid #444; border-radius:8px; color:#fff; font-size:16px; text-align:center}
  button{width:100%; padding:12px; background:#00ff88; color:#000; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer}
  .hidden{display:none}
  #alerta{margin-top:10px; text-align:center; font-size:14px}
</style>
</head>
<body>

<div class="box">
  <h1>ELUCK</h1>

  <div id="pantalla1">
    <input id="correo" type="email" placeholder="Tu Gmail">
    <button onclick="mandarCodigo()">Continuar</button>
  </div>

  <div id="pantalla2" class="hidden">
    <p style="text-align:center; font-size:13px; color:#aaa">Código enviado a: <b id="correo2"></b></p>
    <input id="codigo" type="number" placeholder="6 Dígitos" maxlength="6">
    <button onclick="entrar()">Verificar</button>
    <button onclick="volver()" style="background:#333; color:#fff; margin-top:8px">Volver</button>
  </div>

  <div id="alerta"></div>
</div>

<script>
const URL = 'https://gitaeifuhrncjmmjlwnf.supabase.co'
const KEY = 'sb_publishable_DnAw2v25rXm_q2CJco9oWQ_LqS5x66y'
const supabase = window.supabase.createClient(URL, KEY)

let correoGuardado = "";

function alerta(txt, color){
  document.getElementById('alerta').innerText = txt;
  document.getElementById('alerta').style.color = color;
}

async function mandarCodigo(){
  const email = document.getElementById('correo').value;
  if(!email) return alerta('Pon tu correo', 'red');
  
  alerta('Enviando...', '#00ff88');
  
  // Siempre cambia de pantalla aunque falle, para que veas el input
  correoGuardado = email;
  document.getElementById('correo2').innerText = email;
  document.getElementById('pantalla1').classList.add('hidden');
  document.getElementById('pantalla2').classList.remove('hidden');

  const { error } = await supabase.auth.signInWithOtp({ 
    email: email,
    options: { shouldCreateUser: true }
  });
  
  if(error){ 
    alerta('Error: ' + error.message, 'red'); 
    return; 
  }
  alerta('Revisa tu correo. Código de 6 dígitos', '#00ff88');
}

async function entrar(){
  const otp = document.getElementById('codigo').value;
  if(otp.length != 6) return alerta('Deben ser 6 dígitos', 'red');
  
  alerta('Verificando...', '#00ff88');
  const { data, error } = await supabase.auth.verifyOtp({ 
    email: correoGuardado, 
    token: otp, 
    type: 'email' 
  });
  
  if(error){ 
    alerta('Código incorrecto', 'red'); 
    return; 
  }
  alerta('✅ Bienvenido: ' + data.user.email, '#00ff88');
  // window.location.href = "inicio.html"
}

function volver(){
  document.getElementById('pantalla2').classList.add('hidden');
  document.getElementById('pantalla1').classList.remove('hidden');
  alerta('', '');
}
</script>
</body>
</html>
