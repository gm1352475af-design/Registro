<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ELUCK OTP DEBUG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{background:#0a0a0a; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
    .box{background:#111; padding:30px; border-radius:16px; border:1px solid #00ff88; width:360px}
    input,button{width:100%; padding:14px; margin:10px 0; border-radius:10px; background:#1a1a1a; color:white; border:1px solid #333}
    button{background:#00ff88; color:#000; font-weight:bold; cursor:pointer}
    #msg{margin-top:10px; color:#ffaa00; font-size:13px}
  </style>
</head>
<body>
<div class="box">
  <h2 style="color:#00ff88; text-align:center">ELUCK</h2>
  
  <div id="paso1">
    <input id="correo" type="email" placeholder="tu@correo.com">
    <button onclick="enviarOTP()">Enviar Código</button>
  </div>

  <div id="paso2" style="display:none">
    <input id="otp" placeholder="Código de 6 dígitos">
    <button onclick="verificarOTP()">Verificar</button>
  </div>
  <div id="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://gitaeifuhrncjmmjlwnf.supabase.co'
const SUPABASE_KEY = 'sb_publishable_DnAw2v25rXm_q2CJco9oWQ_LqS5x66y'

try {
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  document.getElementById('msg').innerText = "Supabase conectado ✅";
} catch(e) {
  document.getElementById('msg').innerText = "Error: " + e.message;
}

let correoGlobal = "";

async function enviarOTP(){
  correoGlobal = document.getElementById('correo').value;
  document.getElementById('msg').innerText = "Enviando...";
  
  const { error } = await supabase.auth.signInWithOtp({ email: correoGlobal });
  
  if(error){
    document.getElementById('msg').innerText = "ERROR: " + error.message;
    return;
  }
  
  // Si llegó aquí, esconde paso1 y muestra paso2
  document.getElementById('paso1').style.display = 'none';
  document.getElementById('paso2').style.display = 'block';
  document.getElementById('msg').innerText = "Código enviado a " + correoGlobal;
}

async function verificarOTP(){
  const otp = document.getElementById('otp').value;
  const { data, error } = await supabase.auth.verifyOtp({ email: correoGlobal, token: otp, type: 'email' });
  if(error) return document.getElementById('msg').innerText = "Código incorrecto";
  document.getElementById('msg').innerText = "✅ Entraste: " + data.user.email;
}
</script>
</body>
</html>
