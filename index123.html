<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>App</title>
<style>
  :root{
    --green-dark: #1B3D2F;
    --green-grad: linear-gradient(90deg, #1B3D2F 0%, #2D5A47 100%);
    --nav-bg: #1E2328;
    --bg: #2F2F2F;
    --text: #FFFFFF;
    --text-gray: #A0A0A0;
    --yellow: #FFD700;
  }

  *{margin:0; padding:0; box-sizing:border-box; font-family: 'Arial', sans-serif}
  body{background:var(--bg); height:100vh; display:flex; flex-direction:column; color:var(--text)}

  /* HEADER SUPERIOR VERDE */
  .top-header{
    height:42px; background:var(--green-grad); display:flex; align-items:center; justify-content:flex-end; 
    padding:0 10px; gap:8px
  }
  .btn{
    padding:6px 16px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; border:none
  }
  .btn-registro{
    background:transparent; border:2px solid var(--yellow); color:var(--yellow)
  }
  .btn-acceder{
    background:#3A4F45; color:var(--text); border:1px solid #4A5F55
  }

  /* NAVBAR INFERIOR */
  .navbar{
    height:56px; background:var(--nav-bg); display:flex; justify-content:space-around; align-items:center;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--text-gray);
    font-size:11px; padding:4px 12px
  }
  .nav-item.active{
    background:#2F353B; border-radius:16px; color:var(--text)
  }
  .nav-icon{
    width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2
  }
  .nav-icon-filled{fill:currentColor; stroke:none}

  /* CONTENIDO */
  .content{flex:1; background:var(--bg); overflow-y:auto}
  
  /* PAGES */
  .page{display:none; padding:20px}
  .page.active{display:block}
</style>
</head>
<body>

  <!-- HEADER SUPERIOR -->
  <div class="top-header">
    <button class="btn btn-registro" onclick="alert('Registro')">Registrate</button>
    <button class="btn btn-acceder" onclick="alert('Acceder')">Acceder</button>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-item active" onclick="showPage('home', this)">
      <svg class="nav-icon nav-icon-filled" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="showPage('chats', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>Chats</span>
    </div>
    <div class="nav-item" onclick="showPage('create', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Create</span>
    </div>
    <div class="nav-item" onclick="showPage('notifications', this)">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Notifications</span>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="content">
    <!-- HOME -->
    <div class="page active" id="home"></div>
    <!-- CHATS -->
    <div class="page" id="chats"></div>
    <!-- CREATE -->
    <div class="page" id="create"></div>
    <!-- NOTIFICATIONS -->
    <div class="page" id="notifications"></div>
  </div>

<script>
  function showPage(pageId, element){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById(pageId).classList.add('active');
    element.classList.add('active');
  }
</script>

</body>
</html>
